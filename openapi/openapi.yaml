openapi: 3.0.3
info:
  title: Cocos Challenge Backend
  version: 1.0.0
  description: >
    API del backend challenge de Cocos Capital: portfolio de un usuario,
    búsqueda de activos, envío y cancelación de órdenes.
    Los montos, precios y porcentajes viajan como texto con dos decimales.
servers:
  - url: http://localhost:3000
    description: Local
tags:
  - name: Portfolio
  - name: Instruments
  - name: Orders

paths:
  /v1/users/{userId}/portfolio:
    get:
      tags: [Portfolio]
      summary: Portfolio de un usuario
      description: >
        Devuelve el valor total de la cuenta, los pesos disponibles para operar
        y las posiciones del usuario. Solo se consideran las órdenes en estado FILLED.
      operationId: getPortfolio
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          example: 1
      responses:
        '200':
          description: Portfolio del usuario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }
              example:
                userId: 1
                totalAccountValue: '889756.00'
                availableCash: '753000.00'
                positions:
                  - instrumentId: 31
                    ticker: BMA
                    name: Banco Macro S.A.
                    quantity: -10
                    marketValue: '-15028.00'
                    totalReturnPct: null
                    dailyReturnPct: '-1.15'
                  - instrumentId: 54
                    ticker: METR
                    name: MetroGAS S.A.
                    quantity: 500
                    marketValue: '114750.00'
                    totalReturnPct: '-8.20'
                    dailyReturnPct: '-1.08'
                  - instrumentId: 47
                    ticker: PAMP
                    name: Pampa Holding S.A.
                    quantity: 40
                    marketValue: '37034.00'
                    totalReturnPct: '-0.45'
                    dailyReturnPct: '0.44'
        '400': { $ref: '#/components/responses/ValidationError' }
        '404':
          description: El usuario no existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainError' }
              example: { code: USER_NOT_FOUND, message: User 999 was not found }

  /v1/instruments:
    get:
      tags: [Instruments]
      summary: Buscar activos
      description: >
        Busca activos por coincidencia parcial, sin distinguir mayúsculas, sobre
        el ticker o el nombre. Sin `query` lista todos los activos. El instrumento
        ARS (tipo MONEDA) nunca se devuelve. Los resultados se ordenan por ticker.
      operationId: searchInstruments
      parameters:
        - name: query
          in: query
          required: false
          description: Texto a buscar en ticker o nombre.
          schema: { type: string, maxLength: 50 }
          example: pamp
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Página de activos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstrumentPage' }
              example:
                data:
                  - id: 47
                    ticker: PAMP
                    name: Pampa Holding S.A.
                    type: ACCIONES
                    lastPrice: '925.85'
                    dailyReturnPct: '0.44'
                meta: { page: 1, limit: 20, total: 1, totalPages: 1 }
        '400': { $ref: '#/components/responses/ValidationError' }

  /v1/orders:
    post:
      tags: [Orders]
      summary: Enviar una orden
      description: >
        Envía una orden de compra o venta. Las órdenes MARKET se ejecutan al último
        precio y quedan FILLED; las LIMIT quedan NEW. Si no alcanzan los pesos
        (compra) o las acciones (venta), la orden se graba como REJECTED y la
        respuesta sigue siendo 201, con el motivo en `rejectionReason`.
        Se envía exactamente uno entre `size` y `amount`. `price` es obligatorio
        en LIMIT y no se admite en MARKET.
      operationId: submitOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitOrderRequest' }
            examples:
              marketPorCantidad:
                summary: MARKET por cantidad de acciones
                value: { userId: 1, instrumentId: 47, side: BUY, type: MARKET, size: 10 }
              marketPorMonto:
                summary: MARKET por monto en pesos
                value: { userId: 1, instrumentId: 47, side: BUY, type: MARKET, amount: 50000 }
              limit:
                summary: LIMIT
                value: { userId: 1, instrumentId: 47, side: SELL, type: LIMIT, size: 5, price: 950.5 }
      responses:
        '201':
          description: Orden grabada (FILLED, NEW o REJECTED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
              examples:
                filled:
                  summary: Orden ejecutada
                  value:
                    id: 12
                    userId: 1
                    instrumentId: 47
                    side: BUY
                    type: MARKET
                    size: 10
                    price: '925.85'
                    status: FILLED
                    rejectionReason: null
                    datetime: '2026-11-12T16:40:00.000Z'
                rejected:
                  summary: Orden rechazada por acciones insuficientes
                  value:
                    id: 13
                    userId: 1
                    instrumentId: 47
                    side: SELL
                    type: MARKET
                    size: 100
                    price: '925.85'
                    status: REJECTED
                    rejectionReason: INSUFFICIENT_SHARES
                    datetime: '2026-11-12T16:41:00.000Z'
        '400':
          description: >
            Body inválido, o el instrumento es de tipo MONEDA
            (`INSTRUMENT_NOT_TRADABLE`). No se graba ninguna orden.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/DomainError'
              examples:
                validationError:
                  summary: Body inválido
                  value:
                    message: ['price is only allowed for LIMIT orders']
                    error: Bad Request
                    statusCode: 400
                instrumentNotTradable:
                  summary: Instrumento de tipo MONEDA (ARS)
                  value:
                    code: INSTRUMENT_NOT_TRADABLE
                    message: Instrument 66 is not tradable
        '404':
          description: El usuario o el instrumento no existen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainError' }
              examples:
                userNotFound:
                  summary: El usuario no existe
                  value: { code: USER_NOT_FOUND, message: User 999 was not found }
                instrumentNotFound:
                  summary: El instrumento no existe
                  value: { code: INSTRUMENT_NOT_FOUND, message: Instrument 9999 was not found }
        '422':
          description: Orden MARKET sobre un activo sin datos de mercado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainError' }
              example:
                code: MARKET_PRICE_UNAVAILABLE
                message: Market price is unavailable for instrument 10

  /v1/orders/{orderId}/cancel:
    patch:
      tags: [Orders]
      summary: Cancelar una orden
      description: Cancela una orden en estado NEW. No lleva body.
      operationId: cancelOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          example: 12
      responses:
        '200':
          description: Orden cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404':
          description: La orden no existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainError' }
              example: { code: ORDER_NOT_FOUND, message: Order 99999 was not found }
        '409':
          description: La orden no está en estado NEW
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainError' }
              example:
                code: ORDER_NOT_CANCELLABLE
                message: Order 12 cannot be cancelled in status CANCELLED

components:
  responses:
    ValidationError:
      description: Parámetros inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }

  schemas:
    Decimal2:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      description: Número decimal como texto, con dos decimales.
      example: '925.85'

    Portfolio:
      type: object
      required: [userId, totalAccountValue, availableCash, positions]
      properties:
        userId: { type: integer }
        totalAccountValue:
          allOf: [{ $ref: '#/components/schemas/Decimal2' }]
          description: Pesos disponibles más el valor de mercado de las posiciones.
        availableCash:
          allOf: [{ $ref: '#/components/schemas/Decimal2' }]
          description: Pesos disponibles para operar.
        positions:
          type: array
          items: { $ref: '#/components/schemas/Position' }

    Position:
      type: object
      required: [instrumentId, ticker, name, quantity, marketValue, totalReturnPct, dailyReturnPct]
      properties:
        instrumentId: { type: integer }
        ticker: { type: string }
        name: { type: string }
        quantity:
          type: integer
          description: Cantidad de acciones. Puede ser negativa por una anomalía de los datos provistos.
        marketValue:
          allOf: [{ $ref: '#/components/schemas/Decimal2' }]
          nullable: true
          description: Cantidad por último precio. Null si el activo no tiene precio.
        totalReturnPct:
          allOf: [{ $ref: '#/components/schemas/Decimal2' }]
          nullable: true
          description: Rendimiento total (%) contra el precio promedio de compra.
        dailyReturnPct:
          allOf: [{ $ref: '#/components/schemas/Decimal2' }]
          nullable: true
          description: Retorno diario (%) del activo.

    InstrumentPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Instrument' }
        meta:
          type: object
          required: [page, limit, total, totalPages]
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }

    Instrument:
      type: object
      required: [id, ticker, name, type, lastPrice, dailyReturnPct]
      properties:
        id: { type: integer }
        ticker: { type: string }
        name: { type: string }
        type: { type: string, enum: [ACCIONES] }
        lastPrice:
          allOf: [{ $ref: '#/components/schemas/Decimal2' }]
          nullable: true
          description: Último precio (close) en pesos. Null si no hay datos de mercado.
        dailyReturnPct:
          allOf: [{ $ref: '#/components/schemas/Decimal2' }]
          nullable: true

    SubmitOrderRequest:
      type: object
      required: [userId, instrumentId, side, type]
      oneOf:
        - required: [size]
        - required: [amount]
      additionalProperties: false
      properties:
        userId: { type: integer, minimum: 1 }
        instrumentId: { type: integer, minimum: 1 }
        side: { type: string, enum: [BUY, SELL] }
        type: { type: string, enum: [MARKET, LIMIT] }
        size:
          type: integer
          minimum: 1
          description: Cantidad de acciones. Excluyente con `amount`.
        amount:
          type: number
          exclusiveMinimum: true
          minimum: 0
          multipleOf: 0.01
          description: Monto en pesos. Se opera la máxima cantidad de acciones enteras. Excluyente con `size`.
        price:
          type: number
          exclusiveMinimum: true
          minimum: 0
          multipleOf: 0.01
          description: Precio límite. Obligatorio en LIMIT; no se admite en MARKET.

    Order:
      type: object
      required: [id, userId, instrumentId, side, type, size, price, status, rejectionReason, datetime]
      properties:
        id: { type: integer }
        userId: { type: integer }
        instrumentId: { type: integer }
        side: { type: string, enum: [BUY, SELL] }
        type: { type: string, enum: [MARKET, LIMIT] }
        size: { type: integer, minimum: 0 }
        price: { $ref: '#/components/schemas/Decimal2' }
        status: { type: string, enum: [NEW, FILLED, REJECTED, CANCELLED] }
        rejectionReason:
          type: string
          nullable: true
          enum: [INSUFFICIENT_FUNDS, INSUFFICIENT_SHARES, AMOUNT_BELOW_PRICE, null]
          description: Motivo del rechazo. Solo tiene valor cuando `status` es REJECTED.
        datetime: { type: string, format: date-time }

    DomainError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - USER_NOT_FOUND
            - INSTRUMENT_NOT_FOUND
            - ORDER_NOT_FOUND
            - INSTRUMENT_NOT_TRADABLE
            - MARKET_PRICE_UNAVAILABLE
            - ORDER_NOT_CANCELLABLE
        message: { type: string }

    ValidationError:
      type: object
      required: [statusCode, message, error]
      properties:
        statusCode: { type: integer, example: 400 }
        message:
          type: array
          items: { type: string }
          example: ['page must not be less than 1']
        error: { type: string, example: Bad Request }